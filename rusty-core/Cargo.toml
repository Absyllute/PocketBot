[package]
name = "rusty-core"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rusty_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "experimental-inspect"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
